<!DOCTYPE  html>
<html lang="en">
<head> 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pipeline Tracker</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
    }

    header {
      padding: 16px;
      font-size: 20px;
      font-weight: 600;
    }

    .search {
      margin: 0 12px 12px;
      padding: 12px;
      width: calc(100% - 24px);
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .container {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .title {
      font-size: 18px;
      font-weight: 600;
    }

    .meta {
      font-size: 14px;
      color: #666;
      margin-top: 6px;
    }

    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: black;
      color: white;
      font-size: 28px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }

    input, select {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .btn {
      margin-top: 10px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      color: white;
    }

    .save { background: black; }
    .delete { background: #ff3b30; }
  </style>
</head>

<body>

<header>Pipeline Tracker</header>

<input class="search" id="search" placeholder="Search..." oninput="render()"/>

<div class="container" id="list"></div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Add Item</h3>

    <input id="name" placeholder="Name"/>
    <input id="date" type="date"/>

    <select id="status">
      <option>Active</option>
      <option>Pending</option>
      <option>Closed</option>
    </select>

    <button class="btn save" onclick="saveItem()">Save</button>
    <button class="btn delete" id="deleteBtn" onclick="deleteItem()" style="display:none;">
      Delete
    </button>
  </div>
</div>

<script>
  let items = JSON.parse(localStorage.getItem("pipeline") || "[]");
  let editIndex = null;

  function render() {
    const list = document.getElementById("list");
    const search = document.getElementById("search").value.toLowerCase();

    list.innerHTML = "";

    items
      .filter(i => i.name.toLowerCase().includes(search))
      .forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <div class="title">${item.name}</div>
          <div class="meta">${item.status} • ${item.date || ""}</div>
        `;

        div.onclick = () => editItem(index);
        list.appendChild(div);
      });
  }

  function openModal() {
    editIndex = null;
    document.getElementById("modalTitle").innerText = "Add Item";
    document.getElementById("name").value = "";
    document.getElementById("date").value = "";
    document.getElementById("status").value = "Active";
    document.getElementById("deleteBtn").style.display = "none";
    document.getElementById("modal").style.display = "flex";
  }

  function editItem(index) {
    editIndex = index;
    const item = items[index];

    document.getElementById("modalTitle").innerText = "Edit Item";
    document.getElementById("name").value = item.name;
    document.getElementById("date").value = item.date;
    document.getElementById("status").value = item.status;

    document.getElementById("deleteBtn").style.display = "block";
    document.getElementById("modal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("modal").style.display = "none";
  }

  function saveItem() {
    const name = document.getElementById("name").value;
    const date = document.getElementById("date").value;
    const status = document.getElementById("status").value;

    if (!name) return;

    if (editIndex !== null) {
      items[editIndex] = { name, date, status };
    } else {
      items.push({ name, date, status });
    }

    localStorage.setItem("pipeline", JSON.stringify(items));
    closeModal();
    render();
  }

  function deleteItem() {
    if (editIndex === null) return;

    if (confirm("Delete this item?")) {
      items.splice(editIndex, 1);
      localStorage.setItem("pipeline", JSON.stringify(items));
      closeModal();
      render();
    }
  }

  render();
</script>

</body>
</html>
